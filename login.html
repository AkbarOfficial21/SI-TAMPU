<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Login - Si-Tampu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <img src="logo.png" alt="Logo Si-Tampu" class="logo">
        </div>

        <div class="login-header">
            <h1>Si-Tampu</h1>
            <p>Sistem Pengajuan Surat Tidak Mampu</p>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Nama Pengguna</label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan nama pengguna" required autocomplete="username">
                </div>
                <div class="error-message" id="usernameError">Nama pengguna tidak valid</div>
            </div>

            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan kata sandi" required autocomplete="current-password">
                    <span class="password-toggle" id="passwordToggle">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="error-message" id="passwordError">Kata sandi harus minimal 6 karakter</div>
            </div>

            <div class="captcha-section">
                <div class="captcha-group">
                    <div class="captcha-code" id="captchaCode">CAPTCHA</div>
                    <div class="captcha-input-container">
                        <input type="text" id="captchaInput" class="captcha-input" placeholder="Kode" maxlength="6" required autocomplete="off">
                        <button type="button" class="captcha-refresh" id="refreshCaptcha" title="Refresh CAPTCHA">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
                <div class="error-message" id="captchaError">Kode CAPTCHA tidak valid</div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember">
                <label for="remember">Ingat nama pengguna</label>
            </div>

            <button type="submit" class="login-button" id="loginButton">Masuk</button>
            <div id="loginError" class="error-message" style="text-align:center;margin-top:10px;display:none;"></div>
        </form>

        <div class="login-footer">
            <p>Butuh bantuan?<br>
                <a href="https://wa.me/6282286000149?text=Halo,%20saya%20membutuhkan%20bantuan%20untuk%20Si-Tampu" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-whatsapp"></i> Hubungi via WhatsApp
                </a>
            </p>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">Memproses Login...</div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
